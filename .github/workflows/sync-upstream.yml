name: 同步上游

# 定时把上游仓库（bggRGjQaUbCoE/PiliPlus）的 main 分支变更 rebase 到 fork 的 main 上，
# fork 上的本地 commit（如画质解锁补丁）会被原样重放到新 HEAD 之上，保持历史线性。
#
# 冲突处理：rebase 失败时本 workflow 直接 fail，不会强推丢失工作，主人会收到 GitHub 邮件通知。
# 解决冲突后请本地 rebase 完再 push。

on:
    schedule:
        # 每天 UTC 00:17（北京时间 08:17），错开整点避免拥堵
        - cron: "17 0 * * *"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    sync:
        # 仅在 fork 仓库执行，避免上游仓库错误触发
        if: ${{ github.repository != 'bggRGjQaUbCoE/PiliPlus' }}
        runs-on: ubuntu-latest

        steps:
            - name: 检出 fork main 分支（完整历史）
              uses: actions/checkout@v6
              with:
                  ref: main
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: 配置 git 身份
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: 添加并拉取上游
              run: |
                  git remote add upstream https://github.com/bggRGjQaUbCoE/PiliPlus.git
                  git fetch upstream main

            - name: 检查是否已是最新
              id: check
              run: |
                  LOCAL=$(git rev-parse HEAD)
                  UPSTREAM=$(git merge-base HEAD upstream/main)
                  UPSTREAM_HEAD=$(git rev-parse upstream/main)
                  echo "local=$LOCAL" >> $GITHUB_OUTPUT
                  echo "upstream_head=$UPSTREAM_HEAD" >> $GITHUB_OUTPUT
                  if [ "$UPSTREAM" = "$UPSTREAM_HEAD" ]; then
                      echo "需同步=false"
                      echo "need_sync=false" >> $GITHUB_OUTPUT
                  else
                      echo "需同步=true"
                      echo "need_sync=true" >> $GITHUB_OUTPUT
                  fi

            - name: rebase 上游 main（保留 fork 本地 commit）
              if: steps.check.outputs.need_sync == 'true'
              run: |
                  echo "上游 HEAD: ${{ steps.check.outputs.upstream_head }}"
                  echo "本地 HEAD: ${{ steps.check.outputs.local }}"
                  echo "本地仅有的 commit："
                  git log upstream/main..HEAD --oneline || true
                  git rebase upstream/main

            - name: 推送
              if: steps.check.outputs.need_sync == 'true'
              run: git push origin main --force-with-lease

            - name: 输出结果
              run: |
                  if [ "${{ steps.check.outputs.need_sync }}" = "false" ]; then
                      echo "::notice::已是最新，无需同步"
                  else
                      echo "::notice::已同步上游到 ${{ steps.check.outputs.upstream_head }}，本地 commit 已 rebase 保留"
                  fi
